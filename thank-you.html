<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank you — Befree</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; background: #f7f8fc; color: #33405e; text-align: center; padding: 1.5rem; }
    h1 { color: #0a1a3a; font-size: 1.75rem; margin: 0 0 .5rem; }
    a { color: #1f4fd1; font-weight: 700; }
  </style>
</head>
<body>
  <!--
    Zoho CRM redirects here (the webform's Return URL) after it ACCEPTS a submission.
    Inside the site's hidden iframe, this tells the main page to show the success modal.
    Opened directly (e.g. without JavaScript), it shows a plain confirmation.
  -->
  <main>
    <h1>Thank you for your enquiry.</h1>
    <p>A member of the Befree team will be in touch shortly.</p>
    <p><a href="./">Back to the website</a></p>
  </main>
  <script>
    if (window.parent !== window) {
      window.parent.postMessage({ type: "befree:zoho-success" }, window.location.origin);
    }
  </script>
</body>
</html>
